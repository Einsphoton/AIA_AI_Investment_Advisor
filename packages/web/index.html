<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#06060a" />
    <meta name="description" content="AI 投资顾问 — 自托管 Agent 投资分析终端" />
    <title>AI 投资顾问</title>
    <!-- 黑金徽标：黑曜石底 + 金色描边与走势线 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f7e7b0'/%3E%3Cstop offset='0.5' stop-color='%23d4af37'/%3E%3Cstop offset='1' stop-color='%23b08a25'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0d'/%3E%3Crect x='0.9' y='0.9' width='30.2' height='30.2' rx='7.4' fill='none' stroke='url(%23g)' stroke-width='1.4' opacity='0.85'/%3E%3Cpath d='M7 21l5.4-6.4 4 3.9L25 10' stroke='url(%23g)' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <!-- 首屏底色：在 styles.css 到达前就压成黑曜石，避免白闪 -->
    <style>
      html { background: #030305; }
      body { margin: 0; background: #06060a; }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #7d7566;
        font: 12px/1.6 system-ui, sans-serif;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
      #boot-ring {
        width: 34px;
        height: 34px;
        margin: 0 auto 14px;
        border-radius: 50%;
        border: 2px solid rgba(212, 175, 55, 0.22);
        border-top-color: #eed07f;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot-ring { animation: none; } }
    </style>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" role="status" aria-live="polite">
      <div><div id="boot-ring"></div>Loading</div>
    </div>
    <noscript>本应用需要启用 JavaScript。</noscript>
    <script>
      // React 挂载后移除首屏占位，避免 FOUC。
      window.__aiaBootTimer = setInterval(function () {
        if (document.getElementById('root')?.childElementCount) {
          clearInterval(window.__aiaBootTimer);
          document.getElementById('boot')?.remove();
        }
      }, 40);
      setTimeout(function () {
        clearInterval(window.__aiaBootTimer);
        document.getElementById('boot')?.remove();
      }, 8000);
    </script>
    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
